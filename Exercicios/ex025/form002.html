<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de Formulario</h1>
    <form action="cadastro.php" method="get">
        <p><label for="iusu">Usuario: </label></p>
        <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" placeholder="nome de usuario">
        <p><label for="isenha">Senha: </label></p>
        <input type="password" name="senha" id="isenha" required minlength="8" maxlength="15" placeholder="senha">
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
