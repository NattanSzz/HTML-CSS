<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
        }
        div.item {
            background-color: lightblue;
            border: 1px solid black;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">Conteudo maior</div>
        <div class="item">D</div>
        <div class="item">Conteudo muito mais maior</div>
        <div class="item">F</div>
        <div class="item">Conteudo muito mais maior que o conteudo muito mais maior</div>
    </div>
</body>
</html>
